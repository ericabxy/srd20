description: An Open Game Content documentation project.
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://srd20.radicalgnu.xyz" # the base hostname & protocol for your site, e.g. http://example.com
github_username:  ericabxy
theme: minima
# Plugins
plugins:
- jekyll-optional-front-matter
- jekyll-titles-from-headings
# Collections
collections:
  artifacts:
    output: true
  backgrounds:
    output: true
    permalink: /:title
  creatures:
    output: true
    permalink: /:title
  docs:
    output: true
    permalink: /:title
